name: 버그 리포트
description: 프로그램의 오류나 예상과 다른 동작을 제보합니다.
title: "fix: "
labels:
  - type/bug
  - needs/triage
body:
  - type: textarea
    id: symptom
    attributes:
      label: 버그 현상
      description: 어떤 문제가 발생했는지 간단히 설명해주세요.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 경로
      description: 문제가 발생하는 과정을 순서대로 작성해주세요.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대 결과
      description: 원래 기대했던 동작을 작성해주세요.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 현재 결과
      description: 실제로 발생한 동작을 작성해주세요.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 실행 환경
      description: OS/Browser, Device, Version/Branch를 작성해주세요.
      placeholder: "Windows 11 / Chrome 130 / dev 브랜치"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 로그 / 스크린샷
      description: 에러 로그, 응답 예시, 화면 캡처가 있다면 첨부해주세요.
      render: text
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 추가 정보
      description: 문제를 파악하는 데 도움이 되는 정보가 있다면 작성해주세요.
    validations:
      required: false
