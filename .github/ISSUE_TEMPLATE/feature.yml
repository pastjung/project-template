name: 기능 요청
description: 새로운 기능이나 개선 아이디어를 제안합니다.
title: "feat: "
labels:
  - type/feature
  - needs/triage
body:
  - type: textarea
    id: proposal
    attributes:
      label: 제안 내용
      description: 어떤 기능이나 개선이 필요한지 간단히 설명해주세요.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 이 기능이 어떤 불편함이나 문제를 해결하는지 작성해주세요.
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: 기대 효과
      description: 기능이 추가되었을 때 기대하는 효과를 작성해주세요.
    validations:
      required: false

  - type: textarea
    id: requirements
    attributes:
      label: 상세 요구사항
      description: 필요한 동작, 화면, API, 제약사항이 있다면 작성해주세요.
      placeholder: |
        - [ ]
        - [ ]
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 대안
      description: 이미 고려한 다른 해결 방법이 있다면 작성해주세요.
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 추가 정보
      description: 참고 자료, 화면 예시, 관련 이슈가 있다면 작성해주세요.
    validations:
      required: false
