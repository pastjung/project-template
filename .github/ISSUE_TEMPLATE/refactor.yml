name: 리팩토링 제안
description: 기능 변경 없이 코드 구조 개선이 필요한 부분을 제안합니다.
title: "refactor: "
labels:
  - type/refactor
  - needs/triage
body:
  - type: textarea
    id: target
    attributes:
      label: 리팩토링 대상
      description: 개선이 필요한 모듈, 클래스, 함수, 파일 경로를 작성해주세요.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 현재 문제점
      description: 현재 구조에서 불편하거나 위험한 점을 작성해주세요.
    validations:
      required: true

  - type: textarea
    id: direction
    attributes:
      label: 개선 방향
      description: 어떤 방향으로 구조를 개선하면 좋을지 작성해주세요.
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: 기대 효과
      description: 리팩토링 후 기대되는 유지보수성, 가독성, 테스트 용이성 개선 효과를 작성해주세요.
    validations:
      required: false

  - type: dropdown
    id: behavior-change
    attributes:
      label: 동작 변경 여부
      options:
        - 기능 동작 변경이 없습니다.
        - 기능 동작 변경 가능성이 있어 추가 검증이 필요합니다.
    validations:
      required: true

  - type: textarea
    id: tests
    attributes:
      label: 확인이 필요한 테스트
      description: 리팩토링 후 반드시 확인해야 할 테스트나 시나리오를 작성해주세요.
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 추가 정보
      description: 관련 코드, 이슈, PR, 참고 자료가 있다면 작성해주세요.
    validations:
      required: false
