services:
  redis:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${REDIS_CONTAINER_NAME:-redis}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${REDIS_TIMEZONE:-Asia/Seoul}
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --requirepass
      - ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  redis-data:
