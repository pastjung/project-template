services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - .env.example
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      APP_ENV: dev
      SQLITE_PATH: /app/data/db.sqlite3
    ports:
      - "8000:8000"
    volumes:
      - ./apps:/app/apps
      - ./config:/app/config
      - ./manage.py:/app/manage.py:ro
      - sqlite-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/').read()"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  sqlite-data:
