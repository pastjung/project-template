apiVersion: 1

providers:
  - name: local
    orgId: 1
    folder: Local
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      # provisioning 설정과 대시보드 JSON은 분리해서 관리합니다.
      # 이 경로는 compose에서 ./grafana/dashboards로 마운트됩니다.
      path: /var/lib/grafana/dashboards
