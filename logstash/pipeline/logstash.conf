input {
  beats {
    port => 5044
  }
}

filter {
  mutate {
    add_field => { "ingested_by" => "logstash" }
  }
}

output {
  # data stream(logs-app-default)으로 색인합니다.
  # setup 컨테이너가 만든 index template이 7일 삭제 ILM을 연결합니다.
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    data_stream => "true"
    data_stream_type => "logs"
    data_stream_dataset => "app"
    data_stream_namespace => "default"
  }
}
