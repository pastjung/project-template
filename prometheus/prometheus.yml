global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  # 애플리케이션 메트릭을 수집하려면 job을 추가합니다.
  # - job_name: api
  #   metrics_path: /actuator/prometheus   # Spring Boot 예시
  #   static_configs:
  #     - targets: ["host.docker.internal:8080"]
