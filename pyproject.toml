[project]
name = "django-app"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "django>=5.2,<6.0",
  "djangorestframework>=3.15.0",
  "gunicorn>=23.0.0",
  "python-dotenv>=1.0.0",
  "whitenoise>=6.7.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-django>=4.9.0",
  "ruff>=0.6.0"
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

